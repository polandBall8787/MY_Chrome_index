<!DOCTYPE html>
<html style="background-color: #ff963b;" lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新分頁</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/colorCard.css">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://kit.fontawesome.com/9139f69b49.js" crossorigin="anonymous"></script>
</head>

<body>
  <header>
    <div class="userlogin"></div>
  </header>
  <main>
    <div class="search">
      <div class="search-bar">
        <select name="searchEngine">
          <option id="Google" value="Google" selected>Google</option>
          <option value="Bing">Bing</option>
        </select>
        <input id="searchInput" class="search-input" type="text" autocomplete="off">
        <button id="photoSearch">camera</button>
      </div>
    </div>
  </main>

  <div id="link-bar">
    <div class="brown-border" id="links">
      <a href="https://www.youtube.com/" class="link-button"><i class="fa-brands fa-youtube"></i></a>
      <a href="https://www.bilibili.com/" class="link-button"><i class="fa-brands fa-bilibili"></i></a>
      <a href="https://www.pinterest.com/" class="link-button"><i class="fa-brands fa-pinterest"></i></a>
      <a href="https://github.com/" class="link-button"><i class="fa-brands fa-github"></i></a>
    </div>

    <div class="colorful-border" id="links">
      <a href="https://mail.google.com/mail/u/0/#inbox" class="link-button"><i class="fa-solid fa-envelope"></i></a>
      <a href="https://drive.google.com/drive/u/0/" class="link-button"><i class="fa-brands fa-google-drive"></i></a>
      <a href="https://gemini.google.com/app?hl=zh-TW" class="link-button"><i class="fa-solid fa-gemini"></i></a>
    </div>
  </div>

  <script src="scripts/script.js"></script>
</body>

</html>
